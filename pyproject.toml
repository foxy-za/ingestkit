[project]
name = "ingestkit"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Johann.Raath", email = "Johann.Raath@adcock.com" }
]
requires-python = ">=3.14"
dependencies = [
    "httpx>=0.28.1",
    "pyarrow>=25.0.1",
    "python-dotenv>=1.2.3",
]

[project.scripts]
ingestkit = "ingestkit:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]
